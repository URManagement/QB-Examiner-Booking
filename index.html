<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q2 Examiner Booking</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root{
    /* UR Klinik-inspired: warm ivory ground, clinical white cards, soft gold accent */
    --bg:#faf5ea;
    --surface:#ffffff;
    --surface-2:#f7f0df;
    --surface-3:#efe1c3;
    --gold:#a8783a;
    --gold-bright:#c4954f;
    --crimson:#b23a4c;
    --jade:#3f8467;
    --ink:#26211a;
    --ink-dim:#544c3c;
    --muted:#8a8069;
    --line:rgba(168,120,58,0.24);
    --shadow: 0 18px 44px rgba(120,90,40,0.12);
    --radius: 14px;
    color-scheme: light;
  }
  /* Deliberately no @media (prefers-color-scheme: dark) here — this page
     always shows the same UR gold/cream look regardless of whether the
     visitor's phone or computer is set to dark mode, so it looks
     identical everywhere. The rule below stays reachable only if a
     manual light/dark toggle is added later. */
  :root[data-theme="dark"]{
    --bg:#18130f;
    --surface:#221b15;
    --surface-2:#2b2219;
    --surface-3:#382c1e;
    --gold:#d6ab6c;
    --gold-bright:#ecc78e;
    --crimson:#d16b7b;
    --jade:#6cbb99;
    --ink:#f6ecd9;
    --ink-dim:#d9cbae;
    --muted:#a89a7e;
    --line:rgba(214,171,108,0.24);
    --shadow: 0 20px 60px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 12% -8%, rgba(168,120,58,0.10), transparent 60%),
      radial-gradient(900px 460px at 100% 0%, rgba(63,132,103,0.06), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .display{ font-family:'Playfair Display', Georgia, serif; text-wrap:balance; }
  .mono{ font-family:'Space Mono', ui-monospace, monospace; }

  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--gold); color:#1a1400; }

  .app{ max-width:1080px; margin:0 auto; padding:28px 20px 80px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:34px; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .topbar-logo{ height:24px; width:auto; display:block; }
  .brand-divider{ width:1px; height:20px; background:var(--line); }
  .brand .mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,var(--gold-bright),var(--gold));
    display:flex;align-items:center;justify-content:center;
    color:#221a06; font-weight:800; font-size:15px;
    box-shadow: 0 4px 14px rgba(168,120,58,0.35);
  }
  .brand .name{ font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .brand .name b{ color:var(--ink); }

  .admin-link{
    font-size:12.5px; color:var(--muted); background:var(--surface);
    border:1px solid var(--line); padding:8px 14px; border-radius:100px;
    display:flex; align-items:center; gap:6px; transition:all .15s ease;
  }
  .admin-link:hover{ color:var(--ink); border-color:var(--gold); }

  /* ---------- Marquee / Landing ---------- */
  .marquee{
    text-align:center; padding:54px 20px 46px; position:relative;
  }
  .hero-logo{ height:52px; width:auto; margin:0 auto 22px; display:block; }
  .eyebrow{
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--gold); font-weight:700; margin-bottom:16px;
  }
  .marquee h1{
    font-size:clamp(32px,5.4vw,54px); margin:0 0 14px; line-height:1.08; font-weight:800;
  }
  .marquee h1 em{ color:var(--gold); font-style:normal; }
  .marquee p.sub{ color:var(--ink-dim); font-size:16px; max-width:520px; margin:0 auto 30px; line-height:1.6; }

  .progress-wrap{ max-width:440px; margin:0 auto 34px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:600; }
  .progress-track{ height:8px; border-radius:100px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line); }
  .progress-fill{ height:100%; border-radius:100px; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); transition:width .5s ease; }

  .cta{
    display:inline-flex; align-items:center; gap:10px;
    background:linear-gradient(155deg,var(--gold-bright),var(--gold));
    color:#221a06; font-weight:800; font-size:15px;
    padding:15px 30px; border-radius:100px; border:none;
    box-shadow:0 10px 30px rgba(168,120,58,0.32);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover{ transform:translateY(-2px); box-shadow:0 14px 36px rgba(168,120,58,0.42); }
  .cta:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

  .film-strip{
    display:flex; justify-content:center; gap:6px; margin-top:40px; opacity:.55;
  }
  .film-strip span{ width:5px;height:5px;border-radius:2px; background:var(--gold); }

  /* ---------- Section shell ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:30px; box-shadow:var(--shadow);
  }
  .panel-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  .panel-head h2{ font-size:24px; margin:0 0 6px; font-weight:800; }
  .panel-head p{ margin:0; color:var(--muted); font-size:14px; max-width:460px; }
  .back-link{
    font-size:13px; color:var(--muted); background:none; border:1px solid var(--line);
    padding:8px 14px; border-radius:100px; display:inline-flex; align-items:center; gap:6px;
  }
  .back-link:hover{ color:var(--ink); border-color:var(--gold); }

  .search{
    width:100%; padding:13px 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:16px; margin-bottom:20px;
    font-family:inherit;
  }
  .search::placeholder{ color:var(--muted); }
  .search:focus{ outline:2px solid var(--gold); outline-offset:1px; }

  /* ---------- Candidate ticket stubs ---------- */
  .stub-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px;
  }
  .stub{
    position:relative; text-align:left; background:var(--surface-2);
    border:1px solid var(--line); border-radius:12px; padding:16px 16px 16px 20px;
    color:var(--ink); transition:all .15s ease; overflow:hidden;
  }
  .stub::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:repeating-linear-gradient(180deg,var(--gold) 0 6px, transparent 6px 12px);
  }
  .stub:hover{ border-color:var(--gold); background:var(--surface-3); transform:translateY(-2px); }
  .stub .code{ font-family:'Space Mono',monospace; font-size:14.5px; font-weight:700; letter-spacing:0.02em; }
  .stub .tag{ font-size:11px; color:var(--muted); margin-top:5px; text-transform:uppercase; letter-spacing:0.05em; }
  .stub.done{ opacity:.55; }
  .stub.done .tag.booked{ color:var(--jade); font-weight:700; }

  /* ---------- Examiner mystery cards ---------- */
  .mystery-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;
    perspective:1400px;
  }
  .mystery-card{
    position:relative; height:196px; padding:0; margin:0; border:none; background:none;
    text-align:left; cursor:pointer; color:var(--ink); font:inherit;
    perspective:900px;
  }
  .mystery-card:disabled{ cursor:not-allowed; }
  .mystery-inner{
    position:relative; display:block; width:100%; height:100%;
    transform-style:preserve-3d; transition:transform .7s cubic-bezier(.34,.2,.2,1.06);
    will-change:transform;
  }
  .mystery-card.flipped .mystery-inner{ transform:rotateY(180deg) scale(1.04); }
  .mystery-card.flipped{ z-index:2; }

  /* Pre-flip "shake the box" moment — a quick, increasingly wild 3D
     wobble before the card actually turns over, like rattling a mystery
     box to guess what's inside. */
  @keyframes mysteryShake{
    0%   { transform:rotateZ(0deg)   rotateX(0deg)  rotateY(0deg)   translateY(0)    scale(1); }
    12%  { transform:rotateZ(-3deg)  rotateX(7deg)  rotateY(-10deg) translateY(-3px) scale(1.02); }
    24%  { transform:rotateZ(3deg)   rotateX(-7deg) rotateY(10deg)  translateY(2px)  scale(1.03); }
    36%  { transform:rotateZ(-5deg)  rotateX(8deg)  rotateY(-12deg) translateY(-4px) scale(1.04); }
    48%  { transform:rotateZ(5deg)   rotateX(-8deg) rotateY(12deg)  translateY(3px)  scale(1.05); }
    60%  { transform:rotateZ(-4deg)  rotateX(6deg)  rotateY(-9deg)  translateY(-3px) scale(1.04); }
    72%  { transform:rotateZ(4deg)   rotateX(-5deg) rotateY(8deg)   translateY(2px)  scale(1.03); }
    84%  { transform:rotateZ(-2deg)  rotateX(3deg)  rotateY(-4deg)  translateY(-1px) scale(1.02); }
    100% { transform:rotateZ(0deg)  rotateX(0deg)  rotateY(0deg)   translateY(0)    scale(1.01); }
  }
  .mystery-card.shaking{ z-index:2; }
  .mystery-card.shaking .mystery-inner{
    animation:mysteryShake .6s ease-in-out both;
    transition:none;
  }
  .mystery-card.shaking .mystery-front{ box-shadow:0 16px 34px rgba(0,0,0,0.3); }
  .mystery-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border:1px solid var(--line); border-radius:18px; padding:24px 22px;
    overflow:hidden; display:flex; flex-direction:column; justify-content:center;
  }
  .mystery-front{
    background:
      linear-gradient(155deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 40%),
      var(--surface-2);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), 0 1px 2px rgba(120,90,40,0.06);
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .mystery-front::after{
    content:''; position:absolute; inset:0; border-radius:18px;
    background:radial-gradient(220px 120px at 90% -10%, var(--booth-accent,var(--gold)), transparent 60%);
    opacity:.13; pointer-events:none;
  }
  .mystery-card:hover:not(.full):not(.flipped) .mystery-front{
    border-color:var(--booth-accent,var(--gold)); transform:translateY(-3px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3), 0 14px 32px rgba(0,0,0,0.22);
  }
  .mystery-back{ background:var(--surface-3); transform:rotateY(180deg); }
  .mystery-card .icon{ font-size:26px; margin-bottom:10px; display:block; }

  /* The little "?" monogram standing in for the examiner's face — a thin
     engraved ring rather than a bright emoji, so it reads as a quiet,
     considered mark instead of a cartoon question mark. */
  .mystery-glyph{
    width:34px; height:34px; border-radius:50%; flex:none;
    border:1.5px solid var(--booth-accent,var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600;
    color:var(--booth-accent,var(--gold)); margin-bottom:16px;
  }
  .mystery-card .hint{
    font-family:'Cormorant Garamond',serif; font-style:italic; font-size:21px; font-weight:600;
    line-height:1.25; letter-spacing:0.01em; margin-bottom:16px; color:var(--ink);
  }
  .mystery-card .hint .cake{ font-style:normal; margin-right:2px; }
  .mystery-card .hint-rule{
    width:30px; height:1px; margin-bottom:14px; flex:none;
    background:linear-gradient(90deg, var(--booth-accent,var(--gold)), transparent);
  }
  .mystery-card .nickname{ font-family:'Playfair Display',serif; font-size:19px; font-weight:700; letter-spacing:0.02em; margin-bottom:6px; }
  .mystery-card .flip-status{ font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-dim); }
  .seat-row{ display:flex; align-items:center; gap:8px; }
  .status-light{
    width:10px; height:10px; border-radius:50%; flex:none;
    background:var(--surface-3); border:1px solid var(--line);
    transition:all .2s ease;
  }
  .status-light.on{
    background:var(--booth-accent,var(--gold)); border-color:transparent;
    box-shadow:0 0 9px 2px var(--booth-accent,var(--gold));
  }
  .status-label{ font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.04em; }

  .mystery-card.full .mystery-front{ filter:grayscale(0.75); opacity:.5; }
  .mystery-card.full .mystery-front::before{
    content:'FULLY BOOKED'; position:absolute; top:17px; right:-36px;
    background:var(--crimson); color:#fff; font-size:10px; font-weight:800;
    letter-spacing:0.05em; padding:5px 38px; transform:rotate(28deg);
    box-shadow:0 3px 10px rgba(0,0,0,0.3); z-index:1; white-space:nowrap;
  }

  /* ---------- Modal ---------- */
  .modal-back{
    position:fixed; inset:0; background:rgba(6,7,14,0.68); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:28px; max-width:380px; width:100%; box-shadow:var(--shadow); text-align:center;
  }
  .modal .icon{ font-size:34px; margin-bottom:10px; }
  .modal h3{ margin:0 0 8px; font-size:20px; font-family:'Playfair Display',serif; }
  .modal p{ color:var(--muted); font-size:14px; line-height:1.55; margin:0 0 22px; }
  .modal-actions{ display:flex; gap:10px; }
  .btn-secondary{
    flex:1; padding:12px; border-radius:100px; border:1px solid var(--line);
    background:transparent; color:var(--ink-dim); font-weight:700; font-size:13.5px;
  }
  .btn-secondary:hover{ border-color:var(--muted); color:var(--ink); }
  .btn-primary{
    flex:1; padding:12px; border-radius:100px; border:none;
    background:linear-gradient(155deg,var(--gold-bright),var(--gold)); color:#221a06;
    font-weight:800; font-size:13.5px;
  }
  .btn-primary:disabled{ opacity:.6; }

  /* ---------- Ticket receipt ---------- */
  .ticket-wrap{ display:flex; justify-content:center; padding:20px 0 10px; }
  .ticket{
    position:relative; width:100%; max-width:440px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
  }
  .ticket-top{ padding:26px 26px 20px; text-align:center; }
  .ticket-top .stamp{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--jade); font-weight:800; margin-bottom:10px; }
  .ticket-top .exname{ font-family:'Playfair Display',serif; font-size:26px; font-weight:800; margin:0 0 4px; }
  .ticket-top .exnick{ color:var(--gold); font-size:13.5px; font-weight:700; }
  .ticket-perf{
    position:relative; height:0; border-top:2px dashed var(--line);
  }
  .ticket-perf::before, .ticket-perf::after{
    content:''; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%;
    background:var(--bg);
  }
  .ticket-perf::before{ left:-11px; }
  .ticket-perf::after{ right:-11px; }
  .ticket-bottom{ padding:20px 26px 26px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .ticket-field{ }
  .ticket-field .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:4px; font-weight:700; }
  .ticket-field .v{ font-family:'Space Mono',monospace; font-size:14px; }
  .ticket-actions{ display:flex; justify-content:center; margin-top:26px; }

  .net-banner{
    max-width:520px; margin:0 auto 18px; text-align:center; font-size:12.5px;
    color:var(--crimson); background:rgba(178,58,76,0.08); border:1px solid rgba(178,58,76,0.25);
    padding:8px 14px; border-radius:10px;
  }
  .setup-banner{
    text-align:center; font-size:13px; font-weight:600; color:var(--ink);
    background:rgba(196,149,79,0.16); border:1px solid var(--line); border-radius:10px;
    padding:10px 18px; margin:0 0 28px; line-height:1.6;
  }
  .sheet-btn[aria-disabled="true"]{ opacity:.5; cursor:not-allowed; pointer-events:none; }

  /* ---------- Admin ---------- */
  .lock-form{ max-width:340px; margin:40px auto; text-align:center; }
  .lock-form .icon{ font-size:32px; margin-bottom:14px; }
  .pw-input{
    width:100%; padding:13px 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:16px; margin:16px 0 10px;
    text-align:center; letter-spacing:0.08em; font-family:'Space Mono',monospace;
  }
  .pw-error{ color:var(--crimson); font-size:13px; margin-bottom:10px; min-height:18px; }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:26px; }
  .stat-card{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat-card .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700; margin-bottom:8px; }
  .stat-card .val{ font-family:'Space Mono',monospace; font-size:20px; font-weight:700; }
  .stat-card .bar{ height:5px; border-radius:100px; background:var(--surface-3); margin-top:8px; overflow:hidden; }
  .stat-card .bar i{ display:block; height:100%; background:var(--gold); }

  table.admin-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  table.admin-table th{
    text-align:left; padding:12px 14px; background:var(--surface-2); color:var(--muted);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700;
    border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.admin-table td{ padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.admin-table tr:last-child td{ border-bottom:none; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:100px; font-size:11.5px; font-weight:700; }
  .pill.waiting{ background:rgba(141,146,184,0.15); color:var(--muted); }
  .pill.booked{ background:rgba(63,132,103,0.15); color:var(--jade); }
  .tiny-btn{
    font-size:11.5px; padding:5px 10px; border-radius:100px; border:1px solid var(--line);
    background:transparent; color:var(--muted);
  }
  .tiny-btn:hover{ border-color:var(--crimson); color:var(--crimson); }
  .toolbar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .copy-btn, .sheet-btn{
    font-size:13px; padding:9px 16px; border-radius:100px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-dim); font-weight:700; display:flex; align-items:center; gap:6px;
    text-decoration:none;
  }
  .copy-btn:hover, .sheet-btn:hover{ border-color:var(--gold); color:var(--ink); }
  .conn-dot{ width:7px;height:7px;border-radius:50%; background:var(--jade); display:inline-block; margin-right:6px; box-shadow:0 0 0 3px rgba(63,132,103,0.18); }

  footer{ text-align:center; color:var(--muted); font-size:11.5px; letter-spacing:0.03em; margin-top:50px; }

  @media (max-width:520px){
    .ticket-bottom{ grid-template-columns:1fr 1fr; }
    .panel{ padding:22px; }
  }
</style>
</head>

  // runs dry before the slots do.

  // Within the remaining pool, the pick is still deterministic per
  // (candidate, examiner) pair — stable across refreshes — and staggered
  // with a per-examiner offset so it round-robins evenly across everyone
  // still choosing, instead of everyone landing on the same feature.
  function remainingFeatures(examiner){
    var used = (state.usedFeatures && state.usedFeatures[examiner.key]) || {};
    var all = examiner.features || [];
    var remaining = all.filter(function(f){ return !used[f.text]; });
    // Fallback only if something got out of sync (e.g. rules not yet
    // published so retiring silently failed) — never show a blank card.
    return remaining.length ? remaining : all;
  }
  // Returns the {type, text} object (not just a string) so the caller can
  // decide how to render it (e.g. a 🎂 next to a birthday date).
  function featureFor(candidateCode, examiner){
    var feats = remainingFeatures(examiner);
    if(!feats.length) return null;
    var ci = CANDIDATES.indexOf(candidateCode);
    if(ci < 0) ci = 0;
    var offset = 0;
    for(var i = 0; i < examiner.key.length; i++){ offset += examiner.key.charCodeAt(i); }
    return feats[(ci + offset) % feats.length];
  }

  var TOTAL_SLOTS = EXAMINERS.reduce(function(a,e){return a+e.slots;},0);

  function slug(s){
    return String(s).toUpperCase().trim().replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  }
  function examinerByKey(k){ for(var i=0;i<EXAMINERS.length;i++){ if(EXAMINERS[i].key===k) return EXAMINERS[i]; } return null; }
  function fmtTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleString('en-MY',{ month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    }catch(e){ return ""; }
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  /* ============== STATE ============== */
  var state = {
    view: "landing",          // landing | pick-candidate | pick-examiner | ticket | admin-lock | admin
    counts: {},                // examinerKey -> number booked (from the sheet)
    countsLoaded: false,
    bookedSet: {},              // candidate code -> true, kept live so the picker can gray out taken names
    usedFeatures: {},           // examinerKey -> {feature: true, ...} — features already shown to someone
                                 // who went on to book that examiner, so they're never shown again
    netError: "",
    myRecord: null,            // {candidate, examinerKey, examinerName, examinerNickname, timestamp}
    currentCandidate: null,    // original code string
    checkingMine: false,
    codeInputValue: "",        // what's currently typed in the "enter your code" box
    codeError: "",
    pendingConfirmCandidate: null, // a matched code awaiting the "is this you?" confirmation
    mysteryOrder: null,        // shuffled array of examiner keys for this candidate's card layout
    pendingCardKey: null,      // examiner key of a card just clicked, awaiting the "sure?" confirm
    shakingKey: null,          // examiner key currently doing the pre-flip "shake the box" wobble
    flippingKey: null,         // examiner key of the card currently flipped/booking, if any
    booking: false,
    bookingError: "",
    adminError: "",
    adminSearch: "",
    adminRows: [],              // [{candidate, examinerKey, examinerName, timestamp}] from the sheet
    adminLoaded: false,
    adminLoading: false,
    copyFeedback: false
  };

  function countFor(key){ return state.counts[key] || 0; }
  function totalBooked(){
    var n = 0;
    for(var k in state.counts){ n += state.counts[k]; }
    return n;
  }

  function shuffleArr(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  // Enter the mystery-card screen with a fresh shuffled card layout — each
  // candidate sees the 6 examiners in their own random order, so "card #3"
  // doesn't mean the same thing between different people.
  function enterPickExaminer(){
    state.view = "pick-examiner";
    state.pendingCardKey = null;
    state.shakingKey = null;
    state.flippingKey = null;
    state.mysteryOrder = shuffleArr(EXAMINERS.map(function(e){ return e.key; }));
  }

  /* ============== BACKEND (Firebase Firestore) ============== */
  function backendReady(){ return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf("PASTE_YOUR") !== 0; }

  // Turns a candidate code into a safe Firestore document id (letters/
  // digits/underscore only) so odd characters in a name can never break a
  // doc path. Two different-looking candidate codes could in theory slugify
  // to the same id, but our real candidate list has none that collide.
  function slugify(s){
    return String(s).toUpperCase().trim().replace(/[^A-Z0-9]+/g, "_");
  }

  // Looser normalization used only to MATCH a typed private code — ignores
  // spaces/hyphens/case so "urc 0159", "URC0159" and "urc-0159" all find
  // the same real code, without being so loose that two different real
  // codes could collide (checked: none of the 25 do).
  function normalizeCode(s){
    return String(s).toUpperCase().replace(/[\s\-]+/g, "");
  }
  // Looks up a typed private code against PRIVATE_CODES (never against the
  // visible CANDIDATES label) and returns the matching candidate label, or
  // null. This is the only way in — there's no public list to browse.
  function findCandidate(raw){
    var norm = normalizeCode(raw);
    if(!norm) return null;
    for(var i=0;i<CANDIDATES.length;i++){
      var c = CANDIDATES[i];
      if(normalizeCode(PRIVATE_CODES[c] || "") === norm) return c;
    }
    return null;
  }

  var fsDb = null;

  // Connects to Firestore and opens a live listener on the "counters"
  // collection so every open tab sees slot counts update in real time —
  // no polling needed. Called once from initApp().
  function initFirebase(){
    if(!backendReady()) return;
    try{
      if(!firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
      fsDb = firebase.firestore();
      fsDb.collection("counters").onSnapshot(function(snap){
        var counts = {};
        snap.forEach(function(doc){ counts[doc.id] = doc.data().taken || 0; });
        state.counts = counts;
        state.countsLoaded = true;
        state.netError = "";
        render();
      }, function(){
        state.netError = "暂时连不上服务器，稍后会自动重试。";
        render();
      });
      // Live "who's already booked" set — only candidate codes, never which
      // examiner they picked — so the candidate picker can gray out and
      // disable names the moment they're taken, on every open tab at once.
      fsDb.collection("bookings").onSnapshot(function(snap){
        var booked = {};
        snap.forEach(function(doc){
          var d = doc.data();
          if(d && d.candidate) booked[d.candidate] = true;
        });
        state.bookedSet = booked;
        render();
      }, function(){ /* non-fatal: picker just won't gray out live; booking itself still works */ });
      // Live "features already burned by a real booking" set, keyed by
      // examiner — see remainingFeatures()/featureFor() above.
      fsDb.collection("usedFeatures").onSnapshot(function(snap){
        var used = {};
        snap.forEach(function(doc){ used[doc.id] = doc.data() || {}; });
        state.usedFeatures = used;
        render();
      }, function(){ /* non-fatal: worst case a feature could rarely repeat */ });
    }catch(e){
      state.netError = "Firebase 初始化失败，请检查 FIREBASE_CONFIG 是否填对。";
      render();
    }
  }

  // Checks (and books) a slot inside a single Firestore transaction, so two
  // people clicking the very same instant for the last slot can never both
  // win it — Firestore retries the transaction under the hood if it detects
  // the counter changed under it, and only one of the two writes survives.
  function checkMine(candidate){
    return fsDb.collection("bookings").doc(slugify(candidate)).get().then(function(snap){
      return { ok: true, record: snap.exists ? snap.data() : null };
    });
  }

  function firestoreBook(candidate, examiner, featureShown){
    var bookingRef = fsDb.collection("bookings").doc(slugify(candidate));
    var counterRef = fsDb.collection("counters").doc(examiner.key);
    return fsDb.runTransaction(function(tx){
      return tx.get(bookingRef).then(function(bookingSnap){
        if(bookingSnap.exists){
          return { alreadyBooked: true, record: bookingSnap.data() };
        }
        return tx.get(counterRef).then(function(counterSnap){
          var taken = (counterSnap.exists && counterSnap.data().taken) || 0;
          if(taken >= examiner.slots){
            return { full: true };
          }
          var record = {
            candidate: candidate,
            examinerKey: examiner.key,
            examinerName: examiner.name,
            examinerNickname: examiner.nickname,
            featureShown: featureShown || "",
            timestamp: new Date().toISOString()
          };
          tx.set(bookingRef, record);
          tx.set(counterRef, { taken: taken + 1 }, { merge: true });
          return { ok: true, record: record };
        });
      });
    }).then(function(res){
      // Retire the feature the candidate actually saw — deliberately a
      // separate, best-effort write OUTSIDE the transaction above. This
      // is a nice-to-have anti-leak touch, not core booking correctness:
      // if it fails (e.g. firestore.rules hasn't been republished yet
      // with the "usedFeatures" collection added), the real booking must
      // still stand, never get rolled back or retried because of this.
      if(res && res.ok && res.record && res.record.featureShown){
        try{
          var patch = {};
          patch[res.record.featureShown] = true;
          fsDb.collection("usedFeatures").doc(examiner.key).set(patch, { merge: true }).catch(function(){});
        }catch(e){ /* decorative only — ignore */ }
      }
      return res;
    });
  }

  function adminReset(candidate){
    var bookingRef = fsDb.collection("bookings").doc(slugify(candidate));
    var releasedFeature = null, releasedExaminerKey = null;
    return fsDb.runTransaction(function(tx){
      return tx.get(bookingRef).then(function(bookingSnap){
        if(!bookingSnap.exists){ return { removed: false }; }
        var data = bookingSnap.data();
        releasedFeature = data.featureShown;
        releasedExaminerKey = data.examinerKey;
        var counterRef = fsDb.collection("counters").doc(data.examinerKey);
        return tx.get(counterRef).then(function(counterSnap){
          var taken = (counterSnap.exists && counterSnap.data().taken) || 0;
          tx.delete(bookingRef);
          tx.set(counterRef, { taken: Math.max(0, taken - 1) }, { merge: true });
          return { removed: true };
        });
      });
    }).then(function(res){
      // Free the retired feature back into the pool now that this
      // booking no longer exists — again a separate best-effort write so
      // a hiccup here never blocks HR's reset action itself.
      if(res && res.removed && releasedFeature && releasedExaminerKey){
        try{
          var patch = {};
          patch[releasedFeature] = firebase.firestore.FieldValue.delete();
          fsDb.collection("usedFeatures").doc(releasedExaminerKey).set(patch, { merge: true }).catch(function(){});
        }catch(e){ /* decorative only — ignore */ }
      }
      return res;
    });
  }

  // All sound effects share one lazily-created AudioContext instead of
  // spinning up a new one per sound — cheaper, and avoids ever hitting a
  // browser's cap on simultaneous AudioContexts if someone clicks fast.
  // Created only on first use (most browsers block audio before a user
  // gesture anyway), and never closed — it just sits idle between sounds.
  var sharedAudioCtx = null;
  function getAudioCtx(){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
    if(sharedAudioCtx.state === "suspended"){ try{ sharedAudioCtx.resume(); }catch(e){} }
    return sharedAudioCtx;
  }

  // A soft, short "tick" played on every button-ish click, so the interface
  // feels responsive even before a render finishes. Wrapped in try/catch:
  // some browsers restrict audio until a user gesture, and this should
  // never break the app's actual click handling if audio fails.
  function playClickSound(){
    try{
      var ctx = getAudioCtx();
      if(!ctx) return;
      var now = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = 720;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.09, now + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }catch(e){ /* audio not available — click still works */ }
  }

  // A short "success" chime (no audio file — synthesized with the Web
  // Audio API) that plays once a booking genuinely goes through. Wrapped
  // in try/catch: some browsers restrict audio until a user gesture, and
  // this should never break the booking flow if it fails.
  function playSuccessChime(){
    try{
      var ctx = getAudioCtx();
      if(!ctx) return;
      var now = ctx.currentTime;
      var notes = [523.25, 659.25, 783.99, 1046.50]; // C5 - E5 - G5 - C6, a bright little fanfare
      notes.forEach(function(freq, i){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        var start = now + i * 0.1;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.22, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.4);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.45);
      });
    }catch(e){ /* audio not available — booking still succeeded */ }
  }

  // A short, brand-toned confetti burst for the moment a mystery card
  // flips open. Runs on a <canvas> appended straight to <body> (outside
  // #root) so the periodic render() re-draws of the app never wipe it
  // mid-animation; it removes itself when done.
  function fireConfetti(){
    try{
      var W = window.innerWidth, H = window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      document.body.appendChild(canvas);
      var ctx = canvas.getContext('2d');
      if(!ctx){ canvas.remove(); return; }
      ctx.scale(dpr, dpr);

      // Warm gold / jade / crimson / cream — matches the page's own
      // palette instead of generic rainbow confetti.
      var colors = ['#a8783a', '#c4954f', '#3f8467', '#b23a4c', '#e8d4a8'];
      var count = window.innerWidth < 480 ? 60 : 100;
      var originX = W / 2, originY = H * 0.3;
      var pieces = [];
      for(var i = 0; i < count; i++){
        var angle = Math.random() * Math.PI * 2;
        var speed = 2.5 + Math.random() * 5;
        pieces.push({
          x: originX, y: originY,
          vx: Math.cos(angle) * speed * (0.4 + Math.random() * 0.6),
          vy: Math.sin(angle) * speed - 3,
          size: 4 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.35,
          shape: Math.random() < 0.5 ? 'rect' : 'circle'
        });
      }
      var gravity = 0.16, drag = 0.985, duration = 2000, start = null;

      function frame(ts){
        if(!start) start = ts;
        var elapsed = ts - start;
        ctx.clearRect(0, 0, W, H);
        var fade = Math.max(0, 1 - elapsed / duration);
        pieces.forEach(function(p){
          p.vx *= drag;
          p.vy = p.vy * drag + gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          if(p.shape === 'rect'){
            ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });
        if(elapsed < duration){
          requestAnimationFrame(frame);
        } else {
          canvas.remove();
        }
      }
      requestAnimationFrame(frame);
    }catch(e){ /* confetti is decorative — never let it block a booking */ }
  }

  function attemptBooking(candidate, examiner, featureShown){
    if(!backendReady()){
      state.shakingKey = null;
      state.flippingKey = null;
      state.bookingError = "后台还没接好（Firebase 还没设置），请联系 HR。";
      render();
      return;
    }
    state.booking = true; state.bookingError = ""; render();

    firestoreBook(candidate, examiner, featureShown).then(function(res){
      state.booking = false;
      if(!res){
        state.shakingKey = null;
        state.flippingKey = null;
        state.bookingError = "预订失败，请重试。";
        render();
        return;
      }
      if(res.alreadyBooked){
        state.myRecord = res.record;
        state.view = "ticket";
        render();
        return;
      }
      if(res.ok){
        state.myRecord = res.record;
        state.view = "ticket";
        render();
        playSuccessChime();
        return;
      }
      if(res.full){
        state.bookingError = "抱歉，这位 Examiner 的名额刚刚满了，请翻开另一张卡吧。";
        enterPickExaminer();
        render();
        return;
      }
      state.shakingKey = null;
      state.flippingKey = null;
      state.bookingError = "系统正忙，请再翻一次卡重试。";
      render();
    }).catch(function(){
      state.booking = false;
      state.shakingKey = null;
      state.flippingKey = null;
      state.bookingError = "网络出错了，请检查网络后重试。";
      render();
    });
  }

  /* ============== RENDER ============== */
  function render(){
    var root = document.getElementById("root");
    root.innerHTML = topbar() + setupBanner() + body() + pageFooter();
    wireEvents();
    window.scrollTo({top:0, behavior: state._scrolled ? "smooth" : "auto"});
    state._scrolled = true;
  }

  // A loud, unmissable notice while FIREBASE_CONFIG is still placeholder
  // values — this is what you see while testing the file directly (e.g.
  // previewing it here in chat) before finishing the setup guide's steps.
  // It is NOT a bug: the page is correctly refusing to pretend a backend
  // exists.
  function setupBanner(){
    if(backendReady()) return "";
    return '' +
      '<div class="setup-banner">' +
        '⚠️ 还没接上 Firebase 后台（FIREBASE_CONFIG 还是占位文字）。这只是预览 — ' +
        '照设置指南建好 Firebase 项目 + Firestore，把配置填进文件后，才能真正预订。' +
      '</div>';
  }

  function pageFooter(){
    return '<footer>UR MANAGEMENT &amp; SUPPLIES SDN BHD</footer>';
  }

  function topbar(){
    return '' +
      '<div class="topbar">' +
        '<div class="brand">' +
          '<img class="topbar-logo" src="' + UR_LOGO + '" alt="UR" />' +
          '<div class="brand-divider"></div>' +
          '<div class="mark">Q2</div>' +
          '<div class="name">Quarter Bonus Exam <b>&middot; Examiner Booking</b></div>' +
        '</div>' +
        (state.view === "admin" || state.view === "admin-lock" ?
          '<button class="admin-link" data-action="exit-admin">← 返回预订页</button>' :
          '<button class="admin-link" data-action="open-admin">🔒 HR 后台</button>') +
      '</div>';
  }

  function body(){
    switch(state.view){
      case "landing": return landingView();
      case "pick-candidate": return pickCandidateView();
      case "pick-examiner": return pickExaminerView();
      case "ticket": return ticketView();
      case "admin-lock": return adminLockView();
      case "admin": return adminView();
      default: return landingView();
    }
  }

  function landingView(){
    var pct = Math.round((totalBooked()/TOTAL_SLOTS)*100);
    return '' +
      (state.netError ? '<div class="net-banner">' + esc(state.netError) + '</div>' : '') +
      '<div class="marquee">' +
        '<img class="hero-logo" src="' + UR_LOGO + '" alt="UR" />' +
        '<div class="eyebrow">Quarter 2 &middot; Bonus Assessment</div>' +
        '<h1 class="display">选择你的 <em>Examiner</em></h1>' +
        '<p class="sub">恭喜入围 Quarter 2 Bonus Exam！每位候选人只能预订一位 Examiner，名额有限，先选先得。输入你的 employee code，选择 Examiner 吧。</p>' +
        '<div class="progress-wrap">' +
          '<div class="progress-label"><span>已预订</span><span>' + totalBooked() + ' / ' + TOTAL_SLOTS + '</span></div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
        '<button class="cta" data-action="start">开始预订 &nbsp;🎫</button>' +
        '<div class="film-strip">' + Array(18).fill('<span></span>').join('') + '</div>' +
      '</div>';
  }

  function pickCandidateView(){
    var busy = state.checkingMine;

    // Step 2: a private code matched — show her own full name back so she
    // can visually confirm it's really her before anything happens. This
    // is the main guard against someone fat-fingering (or deliberately
    // using) somebody else's code.
    if(state.pendingConfirmCandidate){
      var c = state.pendingConfirmCandidate;
      var alreadyBooked = !!(state.bookedSet && state.bookedSet[c]);
      return '' +
        '<div class="panel">' +
          '<div class="panel-head">' +
            '<div><h2 class="display">确认身份</h2><p>请确认下面显示的是你自己的名字，再继续。</p></div>' +
            '<button class="back-link" data-action="go-landing">← 返回</button>' +
          '</div>' +
          '<div class="modal" style="margin:12px auto;max-width:420px;">' +
            '<div class="icon">🪪</div>' +
            '<h3 class="display">' + esc(FULL_NAMES[c] || c) + '</h3>' +
            '<p>' + (alreadyBooked ?
              '这个代码已经预订过了。确认后会直接看到当时预订的票 —— 请务必确认这是你自己的名字，不要帮别人查看。' :
              '一旦确认，就会用这个身份去预订 Examiner —— 请确认这真的是你自己，不要帮别人操作。') + '</p>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="cancel-identity" ' + (busy?'disabled':'') + '>不是我，重新输入</button>' +
              '<button class="btn-primary" data-action="confirm-identity" ' + (busy?'disabled':'') + '>' + (busy ? '查询中…' : '对，是我，继续') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    // Step 1 (default and only entry point): type your own private code.
    // There is deliberately no public list to browse — only HR can look
    // codes up (in the admin panel), so nobody can see or guess anyone
    // else's.
    return '' +
      '<div class="panel">' +
        '<div class="panel-head">' +
          '<div><h2 class="display">输入你的 employee code</h2><p>确认身份后才会进入预订——千万别帮别人操作。</p></div>' +
          '<button class="back-link" data-action="go-landing">← 返回</button>' +
        '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
          '<input class="search" style="flex:1;min-width:200px;margin:0;" placeholder="例如 URC0001" value="' + esc(state.codeInputValue) + '" data-role="code-input" />' +
          '<button class="btn-primary" style="flex:none;padding:0 24px;border-radius:100px;" data-action="submit-code">查找</button>' +
        '</div>' +
        (state.codeError ? '<p style="color:var(--crimson);font-weight:700;font-size:13px;margin:10px 0 0;">' + esc(state.codeError) + '</p>' : '') +
        '<p style="color:var(--muted);font-size:12.5px;margin:16px 0 0;">忘记 employee code 了？请联系 HR 查询。</p>' +
      '</div>';
  }

  function pickExaminerView(){
    if(!state.mysteryOrder){
      state.mysteryOrder = shuffleArr(EXAMINERS.map(function(e){ return e.key; }));
    }
    var ordered = state.mysteryOrder.map(examinerByKey).filter(Boolean);
    var anyBusy = !!(state.flippingKey || state.shakingKey || state.pendingCardKey);

    var boxes = ordered.map(function(ex){
      var taken = countFor(ex.key);
      var left = ex.slots - taken;
      var full = left <= 0;
      var shaking = state.shakingKey === ex.key;
      var flipped = state.flippingKey === ex.key;
      var cls = "mystery-card" + (full ? " full" : "") + (shaking ? " shaking" : "") + (flipped ? " flipped" : "");
      var clickable = !full && !anyBusy;
      var feat = featureFor(state.currentCandidate, ex);
      var featText = feat ? (feat.type === "birthday" ? '<span class="cake">🎂</span> ' + esc(feat.text) : esc(feat.text)) : "";
      return '<button class="' + cls + '" style="--booth-accent:' + ex.accent + '" data-key="' + ex.key + '" ' +
        (clickable ? 'data-action="ask-examiner"' : 'disabled') + '>' +
        '<span class="mystery-inner">' +
          '<span class="mystery-face mystery-front">' +
            '<span class="mystery-glyph">?</span>' +
            '<span class="hint">' + featText + '</span>' +
            '<span class="hint-rule"></span>' +
            '<span class="seat-row"><span class="status-light' + (full ? '' : ' on') + '"></span><span class="status-label">' + (full ? '已满' : '可预订') + '</span></span>' +
          '</span>' +
          '<span class="mystery-face mystery-back">' +
            '<span class="icon">' + ex.icon + '</span>' +
            '<span class="nickname">' + esc(ex.name) + '</span>' +
            (flipped ? '<span class="flip-status">' + (state.bookingError ? '预订失败' : '预订中...') + '</span>' : '') +
          '</span>' +
        '</span>' +
      '</button>';
    }).join('');

    var confirmModal = '';
    if(state.pendingCardKey){
      var pendingEx = examinerByKey(state.pendingCardKey);
      if(pendingEx){
        confirmModal = '' +
          '<div class="modal-back">' +
            '<div class="modal" data-stop="1">' +
              '<div class="mystery-glyph" style="margin:0 auto 14px;">?</div>' +
              '<h3 class="display">确定要翻开这张卡吗？</h3>' +
              '<p>翻开之后会直接揭晓并算预订成功，无法反悔或换卡，请再确认一次。</p>' +
              '<div class="modal-actions">' +
                '<button class="btn-secondary" data-action="cancel-card-pick">再想想</button>' +
                '<button class="btn-primary" data-action="confirm-card-pick">对，翻开它</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }
    }

    return '' +
      '<div class="panel">' +
        '<div class="panel-head">' +
          '<div><h2 class="display">' + esc(FULL_NAMES[state.currentCandidate] || state.currentCandidate || '') + ' ，翻开一张卡，看看是哪位 Examiner 吧</h2><p>卡片顺序是随机打乱的，点了会先请你确认一次，确认后翻开就直接算预订成功。</p></div>' +
          '<button class="back-link" data-action="go-pick-candidate" ' + (anyBusy ? 'disabled' : '') + '>← 换一个代号</button>' +
        '</div>' +
        (state.bookingError ? '<p style="color:var(--crimson);font-weight:700;font-size:13px;margin:0 0 16px;">' + esc(state.bookingError) + '</p>' : '') +
        '<div class="mystery-grid">' + boxes + '</div>' +
      '</div>' +
      confirmModal;
  }

  function ticketView(){
    var rec = state.myRecord;
    if(!rec){
      return '<div class="panel"><p style="text-align:center;color:var(--muted);">找不到预订记录。</p><div style="text-align:center;margin-top:16px;"><button class="back-link" data-action="go-landing">← 返回首页</button></div></div>';
    }
    var ex = examinerByKey(rec.examinerKey) || {};
    return '' +
      '<div class="ticket-wrap">' +
        '<div class="ticket">' +
          '<div class="ticket-top">' +
            '<div class="stamp">✓ 预订成功</div>' +
            '<div class="exname">' + (ex.icon||'') + '&nbsp; ' + esc(rec.examinerName || ex.name || '') + '</div>' +
          '</div>' +
          '<div class="ticket-perf"></div>' +
          '<div class="ticket-bottom">' +
            '<div class="ticket-field"><div class="k">候选人代号</div><div class="v">' + esc(rec.candidate) + '</div></div>' +
            '<div class="ticket-field"><div class="k">预订时间</div><div class="v">' + fmtTime(rec.timestamp) + '</div></div>' +
            '<div class="ticket-field" style="grid-column:1/-1;"><div class="k">考试轮次</div><div class="v">Quarter 2 Bonus Exam</div></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<p style="text-align:center;color:var(--muted);font-size:13px;max-width:400px;margin:22px auto 0;">截图保存这张票吧。如需修改 Examiner，请直接联系 HR。</p>' +
      '<div style="text-align:center;margin-top:20px;"><button class="back-link" data-action="go-landing">← 返回首页</button></div>';
  }

  function adminLockView(){
    return '' +
      '<div class="panel lock-form">' +
        '<div class="icon">🔐</div>' +
        '<h2 class="display" style="font-size:22px;margin:0 0 6px;">HR 后台</h2>' +
        '<p style="color:var(--muted);font-size:13.5px;margin:0;">输入密码查看所有预订记录</p>' +
        '<input class="pw-input" type="password" placeholder="密码" data-role="admin-pw" />' +
        '<div class="pw-error">' + esc(state.adminError) + '</div>' +
        '<button class="cta" style="width:100%;justify-content:center;" data-action="submit-admin-pw">进入后台</button>' +
      '</div>';
  }

  function adminView(){
    var statCards = EXAMINERS.map(function(ex){
      var taken = countFor(ex.key);
      var pct = Math.round((taken/ex.slots)*100);
      return '<div class="stat-card">' +
        '<div class="label">' + ex.icon + ' ' + esc(ex.name) + '</div>' +
        '<div class="val">' + taken + ' / ' + ex.slots + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%;background:' + ex.accent + '"></i></div>' +
      '</div>';
    }).join('');

    var byCandidate = {};
    state.adminRows.forEach(function(r){ byCandidate[r.candidate] = r; });

    var q = state.adminSearch.trim().toUpperCase();
    var rows = CANDIDATES.filter(function(c){
      if(!q) return true;
      var name = (FULL_NAMES[c]||"").toUpperCase();
      var code = (PRIVATE_CODES[c]||"").toUpperCase();
      return c.toUpperCase().indexOf(q) !== -1 || name.indexOf(q) !== -1 || code.indexOf(q) !== -1;
    }).map(function(c){
      var rec = byCandidate[c];
      var nameCell = '<td>' + esc(FULL_NAMES[c] || c) + '<div style="color:var(--muted);font-size:11px;">' + esc(PRIVATE_CODES[c] || '') + '</div></td>';
      if(rec){
        var ex = examinerByKey(rec.examinerKey) || {};
        return '<tr>' +
          nameCell +
          '<td><span class="pill booked">已预订</span></td>' +
          '<td>' + (ex.icon||'') + ' ' + esc(rec.examinerName) + '</td>' +
          '<td class="mono">' + fmtTime(rec.timestamp) + '</td>' +
          '<td><button class="tiny-btn" data-action="reset" data-candidate="' + esc(c) + '">重置</button></td>' +
        '</tr>';
      }
      return '<tr>' +
        nameCell +
        '<td><span class="pill waiting">待选</span></td>' +
        '<td style="color:var(--muted);">&mdash;</td>' +
        '<td style="color:var(--muted);">&mdash;</td>' +
        '<td></td>' +
      '</tr>';
    }).join('');

    return '' +
      '<div class="panel">' +
        '<div class="panel-head">' +
          '<div><h2 class="display"><span class="conn-dot"></span>HR 后台面板</h2><p>' + (state.adminLoading ? '正在读取 Firebase…' : ('实时查看 25 位候选人的 Examiner 选择。' + (state.adminLoaded ? '' : ' 暂时读取不到数据，检查 FIREBASE_CONFIG / ADMIN_KEY 是否正确。'))) + '</p></div>' +
        '</div>' +
        '<div class="stat-row">' + statCards + '</div>' +
        '<div class="toolbar">' +
          '<input class="search" style="margin:0;flex:1;min-width:180px;" placeholder="搜索姓名 / 代号 / employee code" value="' + esc(state.adminSearch) + '" data-role="search-admin" />' +
          '<button class="copy-btn" data-action="copy-csv">' + (state.copyFeedback ? '✓ 已复制' : '📋 复制为 CSV') + '</button>' +
          '<button class="copy-btn" data-action="refresh-admin">🔄 刷新</button>' +
        '</div>' +
        '<div class="table-scroll">' +
          '<table class="admin-table">' +
            '<thead><tr><th>姓名 / employee code</th><th>状态</th><th>选择的 Examiner</th><th>预订时间</th><th></th></tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>';
  }

  /* ============== EVENTS ============== */
  function wireEvents(){
    var root = document.getElementById("root");

    root.querySelectorAll('[data-action]').forEach(function(el){
      el.addEventListener('click', function(ev){
        if(el.hasAttribute('data-stop')) return;
        playClickSound();
        var action = el.getAttribute('data-action');
        handleAction(action, el, ev);
      });
    });

    // Click-outside-to-cancel for the "sure you want to open this card?"
    // confirm dialog — only when the click lands on the dimmed backdrop
    // itself, never when it bubbles up from the dialog box inside it.
    var pickModalBack = root.querySelector('.modal-back');
    if(pickModalBack){
      pickModalBack.addEventListener('click', function(ev){
        if(ev.target === pickModalBack){ handleAction('cancel-card-pick'); }
      });
    }

    var searchAdmin = root.querySelector('[data-role="search-admin"]');
    if(searchAdmin){
      searchAdmin.addEventListener('input', function(){ state.adminSearch = searchAdmin.value; renderKeepFocus(searchAdmin); });
    }
    var pwInput = root.querySelector('[data-role="admin-pw"]');
    if(pwInput){
      pwInput.focus();
      pwInput.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter'){ handleAction('submit-admin-pw'); }
      });
    }
    var codeInput = root.querySelector('[data-role="code-input"]');
    if(codeInput){
      codeInput.focus();
      codeInput.addEventListener('input', function(){ state.codeInputValue = codeInput.value; });
      codeInput.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter'){ handleAction('submit-code'); }
      });
    }

  }

  function renderKeepFocus(inputEl){
    var pos = inputEl.selectionStart;
    var val = inputEl.value;
    render();
    var root = document.getElementById("root");
    var again = root.querySelector('[data-role="' + inputEl.getAttribute('data-role') + '"]');
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
  }

  function handleAction(action, el){
    if(action === "start"){ state.view = "pick-candidate"; render(); return; }
    if(action === "go-landing"){
      state.view = "landing"; state.currentCandidate=null;
      state.pendingConfirmCandidate = null; state.codeInputValue = ""; state.codeError = "";
      render();
      return;
    }
    if(action === "go-pick-candidate"){
      state.view = "pick-candidate";
      state.pendingConfirmCandidate = null; state.codeInputValue = ""; state.codeError = "";
      render();
      return;
    }

    if(action === "submit-code"){
      var root0 = document.getElementById("root");
      var inputEl = root0.querySelector('[data-role="code-input"]');
      var raw = inputEl ? inputEl.value : state.codeInputValue;
      var match = findCandidate(raw);
      if(!match){
        state.codeError = raw.trim() ? "找不到这个 employee code，请检查是否输入正确。" : "请先输入你的 employee code。";
        render();
        return;
      }
      state.codeError = "";
      state.pendingConfirmCandidate = match;
      render();
      return;
    }

    if(action === "cancel-identity"){
      state.pendingConfirmCandidate = null;
      state.codeInputValue = "";
      state.codeError = "";
      render();
      return;
    }

    if(action === "confirm-identity"){
      if(state.checkingMine) return;
      var c = state.pendingConfirmCandidate;
      if(!c) return;
      state.currentCandidate = c;
      state.checkingMine = true;
      state.bookingError = "";
      render();
      if(!backendReady()){
        state.checkingMine = false;
        state.pendingConfirmCandidate = null;
        enterPickExaminer();
        render();
        return;
      }
      checkMine(c).then(function(res){
        state.checkingMine = false;
        state.pendingConfirmCandidate = null;
        if(res && res.ok && res.record){
          state.myRecord = res.record;
          state.view = "ticket";
        } else {
          enterPickExaminer();
        }
        render();
      }).catch(function(){
        state.checkingMine = false;
        state.pendingConfirmCandidate = null;
        enterPickExaminer(); // fail open — worst case they try to book and the server catches a dupe
        render();
      });
      return;
    }

    if(action === "ask-examiner"){
      // First tap just opens a "sure?" confirmation — nothing happens to
      // this card yet. See "confirm-card-pick" for the actual shake/flip/
      // book sequence.
      if(state.shakingKey || state.flippingKey || state.booking || state.pendingCardKey) return;
      var key = el.getAttribute('data-key');
      var examiner = examinerByKey(key);
      if(!examiner || !state.currentCandidate) return;
      state.pendingCardKey = key;
      render();
      return;
    }
    if(action === "cancel-card-pick"){
      state.pendingCardKey = null;
      render();
      return;
    }
    if(action === "confirm-card-pick"){
      var pendingKey = state.pendingCardKey;
      if(!pendingKey) return;
      var pendingExaminer = examinerByKey(pendingKey);
      if(!pendingExaminer || !state.currentCandidate) return;
      var candidateForBooking = state.currentCandidate;
      // Capture exactly the feature this candidate is looking at right now,
      // before anything else can shift the remaining pool — this is the
      // one that gets retired if the booking goes through.
      var featureShown = featureFor(candidateForBooking, pendingExaminer);
      var featureText = featureShown ? featureShown.text : "";
      state.pendingCardKey = null;
      state.shakingKey = pendingKey;
      state.bookingError = "";
      render();
      // Shake the box first, THEN flip it open — flipping the card IS the
      // booking action, so the reveal should feel like the real moment of
      // commitment, not a decorative delay.
      setTimeout(function(){
        if(state.shakingKey !== pendingKey) return; // candidate backed out / state moved on
        state.shakingKey = null;
        state.flippingKey = pendingKey;
        render();
        fireConfetti();
        setTimeout(function(){
          attemptBooking(candidateForBooking, pendingExaminer, featureText);
        }, 700);
      }, 600);
      return;
    }

    if(action === "open-admin"){ state.view = "admin-lock"; state.adminError=""; render(); return; }
    if(action === "exit-admin"){ state.view = "landing"; render(); return; }
    if(action === "submit-admin-pw"){
      var root = document.getElementById("root");
      var pw = root.querySelector('[data-role="admin-pw"]');
      var val = pw ? pw.value : "";
      if(val === ADMIN_KEY){
        state.view = "admin"; state.adminError="";
        render();
        loadAdminData();
      } else {
        state.adminError = "密码错误，请重试。";
        render();
      }
      return;
    }
    if(action === "refresh-admin"){ loadAdminData(); return; }
    if(action === "reset"){
      var c2 = el.getAttribute('data-candidate');
      if(el.getAttribute('data-armed') !== '1'){
        el.setAttribute('data-armed','1');
        el.textContent = '确认重置？';
        setTimeout(function(){ if(el.isConnected){ el.setAttribute('data-armed','0'); el.textContent='重置'; } }, 3000);
        return;
      }
      el.disabled = true;
      el.textContent = '重置中…';
      adminReset(c2).then(function(){ loadAdminData(); }).catch(function(){ loadAdminData(); });
      return;
    }
    if(action === "copy-csv"){
      var lines = ["Candidate,FullName,PrivateCode,Status,Examiner,Timestamp"];
      var byC = {};
      state.adminRows.forEach(function(r){ byC[r.candidate] = r; });
      CANDIDATES.forEach(function(c3){
        var rec = byC[c3];
        var name3 = FULL_NAMES[c3] || "";
        var code3 = PRIVATE_CODES[c3] || "";
        if(rec){ lines.push([c3, name3, code3, "Booked", rec.examinerName, rec.timestamp].join(",")); }
        else { lines.push([c3, name3, code3, "Waiting", "", ""].join(",")); }
      });
      var csv = lines.join("\n");
      var done = function(){ state.copyFeedback = true; render(); setTimeout(function(){ state.copyFeedback=false; render(); }, 1800); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(csv).then(done).catch(done);
      } else { done(); }
      return;
    }
  }

  function loadAdminData(){
    if(!backendReady()){
      state.adminLoaded = false;
      render();
      return;
    }
    state.adminLoading = true;
    render();
    fsDb.collection("bookings").get().then(function(snap){
      state.adminLoading = false;
      var rows = [];
      snap.forEach(function(doc){ rows.push(doc.data()); });
      state.adminRows = rows;
      state.adminLoaded = true;
      render();
    }).catch(function(){
      state.adminLoading = false;
      state.adminLoaded = false;
      render();
    });
  }

  function initApp(){
    render();
    initFirebase();
  }

  initApp();
})();
</script>

</body>
</html>
