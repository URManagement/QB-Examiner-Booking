<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q2 Examiner Booking</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

  :root{
    /* Soft chocolate-brown ground with warm gold leaf accents — a fixed,
       intentional dark theme (not tied to the visitor's system light/dark
       setting) so the page always reads the same "private lounge" way
       everywhere it's opened. Kept mid-dark rather than near-black, and
       text kept a soft cream rather than blazing white, so it's easy on
       the eyes for something people will stare at for a minute or two. */
    --bg:#28201a;
    --surface:#3b2f24;
    --surface-2:#332720;
    --surface-3:#4c3c2c;
    --gold:#d3a568;
    --gold-bright:#eebd82;
    --gold-rgb:211,165,104;
    --gold-bright-rgb:238,189,130;
    --crimson:#dd8b9c;
    --crimson-rgb:221,139,156;
    --jade:#83c9a2;
    --jade-rgb:131,201,162;
    --ink:#ecdfc9;
    --ink-dim:#cdb794;
    --muted:#a3906f;
    --muted-rgb:163,144,111;
    --line:rgba(211,165,104,0.26);
    --shadow: 0 20px 48px rgba(0,0,0,0.38), 0 0 0 1px rgba(211,165,104,0.05), 0 0 40px -14px rgba(211,165,104,0.24);
    --card-glow: 0 10px 22px rgba(0,0,0,0.3), 0 0 0 1px rgba(211,165,104,0.05), 0 0 26px -12px rgba(211,165,104,0.26);
    --card-glow-hover: 0 14px 30px rgba(0,0,0,0.36), 0 0 0 1px rgba(211,165,104,0.12), 0 0 36px -8px rgba(211,165,104,0.42);
    --radius: 14px;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 12% -8%, rgba(211,165,104,0.13), transparent 60%),
      radial-gradient(900px 460px at 100% 0%, rgba(131,201,162,0.05), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .display{ font-family:'Playfair Display', 'Noto Serif SC', Georgia, serif; text-wrap:balance; }
  .mono{ font-family:'Space Mono', ui-monospace, monospace; }

  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--gold); color:#1a1400; }

  .app{ max-width:1080px; margin:0 auto; padding:28px 20px 80px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:34px; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .topbar-logo{ height:24px; width:auto; display:block; }
  .brand-divider{ width:1px; height:20px; background:var(--line); }
  .brand .mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,var(--gold-bright),var(--gold));
    display:flex;align-items:center;justify-content:center;
    color:#221a06; font-weight:800; font-size:15px;
    box-shadow: 0 4px 14px rgba(var(--gold-rgb),0.4);
  }
  .brand .name{ font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .brand .name b{ color:var(--ink); }

  .admin-link{
    font-size:12.5px; color:var(--muted); background:var(--surface);
    border:1px solid var(--line); padding:8px 14px; border-radius:100px;
    display:flex; align-items:center; gap:6px; transition:all .15s ease;
  }
  .admin-link:hover{ color:var(--ink); border-color:var(--gold); }

  /* ---------- Welcome splash (shown once, slowly, before landing) ---------- */
  /* A staged reveal — glow blooms, logo settles in, a thin gold rule
     draws itself, then the two lines of text rise in one after another,
     with the second line catching a slow light-sweep across the gold —
     rather than everything just fading in as one flat block. Meant to
     feel like a curtain lifting, not a loading spinner. */
  .intro-screen{
    position:relative; text-align:center; padding:170px 20px; overflow:hidden;
    animation:introSceneIn .4s ease both;
  }
  .intro-screen.intro-out{
    animation:introSceneOut .6s cubic-bezier(.4,0,.2,1) both;
  }
  @keyframes introSceneIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes introSceneOut{
    from{ opacity:1; filter:blur(0); transform:scale(1); }
    to{ opacity:0; filter:blur(8px); transform:scale(1.035); }
  }

  .intro-glow{
    position:absolute; left:50%; top:36%; width:560px; height:560px; z-index:0;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(var(--gold-rgb),0.3), transparent 70%);
    filter:blur(6px); pointer-events:none;
    animation:introGlowPulse 4.2s ease-in-out infinite;
  }
  @keyframes introGlowPulse{
    0%,100%{ opacity:.5; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:.85; transform:translate(-50%,-50%) scale(1.14); }
  }

  .intro-particles{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .intro-particles span{
    position:absolute; bottom:-14px; border-radius:50%;
    background:radial-gradient(circle, rgba(var(--gold-bright-rgb),0.95), rgba(var(--gold-rgb),0.05) 70%);
    opacity:0; animation-name:introParticleFloat; animation-timing-function:ease-in; animation-iteration-count:infinite;
  }
  @keyframes introParticleFloat{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }
    12%{ opacity:.9; }
    80%{ opacity:.25; }
    100%{ opacity:0; transform:translateY(-420px) scale(1); }
  }

  .intro-logo{
    position:relative; z-index:1; opacity:0;
    animation:introLogoIn .5s cubic-bezier(.16,.8,.24,1) .05s both;
  }
  .intro-eyebrow{
    position:relative; z-index:1; opacity:0;
    animation:introRise .45s cubic-bezier(.16,.8,.24,1) .45s both;
  }
  .intro-divider{
    position:relative; z-index:1; width:0; height:1px; margin:20px auto 24px; opacity:0;
    background:linear-gradient(90deg,transparent,var(--gold-bright),transparent);
    animation:introDivider .4s cubic-bezier(.3,.7,.3,1) .75s both;
  }
  .intro-congrats{ position:relative; z-index:1; margin:0; }
  .intro-line1{
    display:block; opacity:0; font-size:clamp(22px,3.6vw,32px); font-weight:700;
    color:var(--ink-dim); letter-spacing:0.05em; margin-bottom:14px;
    animation:introRise .45s cubic-bezier(.16,.8,.24,1) 1s both;
  }
  .intro-line2{
    display:inline-block; opacity:0; font-size:clamp(32px,5.4vw,52px); font-weight:800;
    background:linear-gradient(100deg, var(--gold) 28%, var(--gold-bright) 45%, #fff6e2 50%, var(--gold-bright) 55%, var(--gold) 72%);
    background-size:280% 100%; background-position:100% 0;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:introRise .5s cubic-bezier(.16,.8,.24,1) 1.35s both,
              introShimmer 1.4s ease-in-out 1.9s infinite;
  }
  @keyframes introLogoIn{ from{ opacity:0; transform:translateY(10px) scale(.9); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes introRise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes introDivider{ from{ width:0; opacity:0; } to{ width:150px; opacity:1; } }
  @keyframes introShimmer{ from{ background-position:110% 0; } to{ background-position:-70% 0; } }

  /* ---------- Marquee / Landing ---------- */
  @keyframes marqueeIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
  .marquee{
    text-align:center; padding:54px 20px 46px; position:relative;
    animation: marqueeIn .8s cubic-bezier(.16,.8,.24,1) both;
  }
  .hero-logo{ height:52px; width:auto; margin:0 auto 22px; display:block; }
  .eyebrow{
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--gold); font-weight:700; margin-bottom:16px;
  }
  .theme-stem{
    display:block; margin:0 0 16px;
    font-family:'Playfair Display','Noto Serif SC',serif; font-weight:800;
    font-size:clamp(30px,5.2vw,50px); line-height:1.14; color:var(--ink);
  }
  .theme-stem .stem-quote{ color:var(--gold-bright); }
  .marquee h1{
    display:inline-flex; align-items:center; gap:8px; margin:0 0 20px;
    font-family:'Noto Serif SC','Cormorant Garamond',serif; font-weight:600;
    font-size:clamp(15px,2vw,18px); line-height:1.35; color:var(--ink-dim);
    padding:9px 20px; border:1px solid var(--line); border-radius:100px;
  }
  .marquee h1 em{ color:var(--gold); font-style:normal; font-weight:700; }
  .marquee p.sub{ color:var(--ink-dim); font-size:16px; max-width:520px; margin:0 auto 30px; line-height:1.6; }

  .progress-wrap{ max-width:440px; margin:0 auto 34px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:600; }
  .progress-track{ height:8px; border-radius:100px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line); }
  .progress-fill{ height:100%; border-radius:100px; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); transition:width .5s ease; }

  .cta{
    display:inline-flex; align-items:center; gap:10px;
    background:linear-gradient(155deg,var(--gold-bright),var(--gold));
    color:#221a06; font-weight:800; font-size:15px;
    padding:15px 30px; border-radius:100px; border:none;
    box-shadow:0 10px 30px rgba(var(--gold-rgb),0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover{ transform:translateY(-2px); box-shadow:0 14px 36px rgba(var(--gold-rgb),0.48); }
  .cta:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

  .film-strip{
    display:flex; justify-content:center; gap:6px; margin-top:40px; opacity:.55;
  }
  .film-strip span{ width:5px;height:5px;border-radius:2px; background:var(--gold); }

  /* ---------- Section shell ---------- */
  .panel{
    position:relative; background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:30px; box-shadow:var(--shadow); overflow:hidden;
  }
  .panel::before{
    content:''; position:absolute; top:0; left:8%; right:8%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(var(--gold-bright-rgb),0.55), transparent);
  }
  .panel-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  .panel-head h2{ font-size:24px; margin:0 0 6px; font-weight:800; }
  .panel-head p{ margin:0; color:var(--muted); font-size:14px; max-width:460px; }
  .back-link{
    font-size:13px; color:var(--muted); background:none; border:1px solid var(--line);
    padding:8px 14px; border-radius:100px; display:inline-flex; align-items:center; gap:6px;
  }
  .back-link:hover{ color:var(--ink); border-color:var(--gold); }

  .question-banner{
    display:flex; align-items:baseline; flex-wrap:wrap; gap:10px 14px;
    margin:0 0 20px; padding:14px 18px;
    background:linear-gradient(135deg, rgba(var(--gold-rgb),0.10), rgba(var(--gold-rgb),0.03));
    border:1px solid rgba(var(--gold-rgb),0.35); border-left:3px solid var(--gold);
    border-radius:10px;
  }
  .question-banner .q-label{
    font-size:11px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--gold); flex-shrink:0;
  }
  .question-banner .q-stem{
    font-family:'Noto Serif SC','Cormorant Garamond',serif; font-weight:600;
    font-size:16px; color:var(--ink);
  }

  .search{
    width:100%; padding:13px 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:16px; margin-bottom:20px;
    font-family:inherit;
  }
  .search::placeholder{ color:var(--muted); }
  .search:focus{ outline:2px solid var(--gold); outline-offset:1px; }

  /* ---------- Candidate ticket stubs ---------- */
  .stub-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px;
  }
  .stub{
    position:relative; text-align:left; background:var(--surface-2);
    border:1px solid var(--line); border-radius:12px; padding:16px 16px 16px 20px;
    color:var(--ink); transition:all .15s ease; overflow:hidden;
    box-shadow:var(--card-glow);
  }
  .stub::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:repeating-linear-gradient(180deg,var(--gold) 0 6px, transparent 6px 12px);
  }
  .stub::after{
    content:''; position:absolute; top:0; left:16%; right:16%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(var(--gold-bright-rgb),0.7), transparent);
  }
  .stub:hover{
    border-color:var(--gold); background:var(--surface-3); transform:translateY(-2px);
    box-shadow:var(--card-glow-hover);
  }
  .stub .code{ font-family:'Space Mono',monospace; font-size:14.5px; font-weight:700; letter-spacing:0.02em; }
  .stub .tag{ font-size:11px; color:var(--muted); margin-top:5px; text-transform:uppercase; letter-spacing:0.05em; }
  .stub.done{ opacity:.55; }
  .stub.done .tag.booked{ color:var(--jade); font-weight:700; }

  /* ---------- Answer grid (candidate-facing) ---------- */
  /* Every answer card carries only a small decorative icon picked to match
     that answer's own words (a star for "be a role model", a sprout for
     "help others grow", etc) — never a per-examiner accent color, and
     never anything that could hint at which secret examiner sits behind
     it. The only functional states are: available, taken by someone else
     (dim + disabled), and the one this candidate is currently confirming. */
  .answer-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;
  }
  .answer-card{
    position:relative; width:100%; text-align:left; cursor:pointer;
    background:radial-gradient(120% 140% at 0% 0%, var(--surface) 0%, var(--surface-2) 62%);
    border:1px solid var(--line); border-radius:18px;
    padding:20px 20px 18px; color:var(--ink); font:inherit;
    transition:all .18s ease;
    display:flex; flex-direction:column; gap:14px; min-height:150px;
    box-shadow:var(--card-glow);
  }
  .answer-card::before{
    content:''; position:absolute; top:0; left:12%; right:12%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(var(--gold-bright-rgb),0.75), transparent);
  }
  .answer-card .head-row{ display:flex; align-items:center; gap:12px; }
  .icon-badge{
    width:42px; height:42px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface);
    box-shadow:0 0 0 3px var(--surface-2), 0 0 0 4px var(--line);
    transition:box-shadow .18s ease;
  }
  .icon-badge svg{ width:22px; height:22px; opacity:0.88; }
  .stub .icon-badge{ width:34px; height:34px; margin-bottom:8px; }
  .stub .icon-badge svg{ width:18px; height:18px; }
  .answer-card .num{
    font-family:'Space Mono',monospace; font-size:11.5px; color:var(--muted);
    letter-spacing:0.04em;
  }
  .answer-card .txt{
    font-family:'Noto Serif SC','Cormorant Garamond',serif; font-weight:600;
    font-size:18.5px; line-height:1.5; color:var(--ink); flex:1; letter-spacing:0.01em;
  }
  .answer-card .seat-row{ display:flex; align-items:center; gap:8px; margin-top:auto; }
  .answer-card:hover:not(:disabled){
    border-color:var(--gold); transform:translateY(-3px);
    box-shadow:var(--card-glow-hover);
  }
  .answer-card:hover:not(:disabled) .icon-badge{
    box-shadow:0 0 0 3px var(--surface-2), 0 0 0 4px var(--gold);
  }
  .answer-card:disabled{ cursor:not-allowed; }
  .answer-card.taken{ opacity:.45; filter:grayscale(0.4); }
  .answer-card.taken .txt{ color:var(--muted); }

  .status-light{
    width:9px; height:9px; border-radius:50%; flex:none;
    background:var(--surface-3); border:1px solid var(--line);
    transition:all .2s ease;
  }
  .status-light.on{
    background:var(--jade); border-color:transparent;
    box-shadow:0 0 8px 1px rgba(var(--jade-rgb),0.55);
  }
  .status-label{ font-family:'Space Mono',monospace; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }

  /* ---------- Modal ---------- */
  .modal-back{
    position:fixed; inset:0; background:rgba(6,7,14,0.68); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{
    position:relative; background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:28px; max-width:380px; width:100%; box-shadow:var(--shadow); text-align:center;
    overflow:hidden;
  }
  .modal::before{
    content:''; position:absolute; top:0; left:10%; right:10%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(var(--gold-bright-rgb),0.6), transparent);
  }
  .modal .icon{ font-size:34px; margin-bottom:10px; }
  .modal h3{ margin:0 0 8px; font-size:20px; font-family:'Playfair Display',serif; }
  .modal p{ color:var(--muted); font-size:14px; line-height:1.55; margin:0 0 22px; }
  .modal-actions{ display:flex; gap:10px; }
  .btn-secondary{
    flex:1; padding:12px; border-radius:100px; border:1px solid var(--line);
    background:transparent; color:var(--ink-dim); font-weight:700; font-size:13.5px;
  }
  .btn-secondary:hover{ border-color:var(--muted); color:var(--ink); }
  .btn-primary{
    flex:1; padding:12px; border-radius:100px; border:none;
    background:linear-gradient(155deg,var(--gold-bright),var(--gold)); color:#221a06;
    font-weight:800; font-size:13.5px;
  }
  .btn-primary:disabled{ opacity:.6; }

  /* ---------- Ticket receipt ---------- */
  .ticket-wrap{ display:flex; justify-content:center; padding:20px 0 10px; }
  .ticket{
    position:relative; width:100%; max-width:440px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
  }
  .ticket::before{
    content:''; position:absolute; top:0; left:14%; right:14%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(var(--gold-bright-rgb),0.6), transparent);
  }
  .ticket-top{ padding:26px 26px 20px; text-align:center; }
  .ticket-top .stamp{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--jade); font-weight:800; margin-bottom:10px; }
  .ticket-top .exname{ font-family:'Noto Serif SC','Playfair Display',serif; font-size:24px; font-weight:700; margin:0 0 4px; }
  .ticket-top .exnick{ color:var(--gold); font-size:13.5px; font-weight:700; }
  .ticket-perf{
    position:relative; height:0; border-top:2px dashed var(--line);
  }
  .ticket-perf::before, .ticket-perf::after{
    content:''; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%;
    background:var(--bg);
  }
  .ticket-perf::before{ left:-11px; }
  .ticket-perf::after{ right:-11px; }
  .ticket-bottom{ padding:20px 26px 26px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .ticket-field{ }
  .ticket-field .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:4px; font-weight:700; }
  .ticket-field .v{ font-family:'Space Mono',monospace; font-size:14px; }
  .ticket-actions{ display:flex; justify-content:center; margin-top:26px; }

  .net-banner{
    max-width:520px; margin:0 auto 18px; text-align:center; font-size:12.5px;
    color:var(--crimson); background:rgba(var(--crimson-rgb),0.12); border:1px solid rgba(var(--crimson-rgb),0.3);
    padding:8px 14px; border-radius:10px;
  }
  .setup-banner{
    text-align:center; font-size:13px; font-weight:600; color:var(--ink);
    background:rgba(var(--gold-bright-rgb),0.16); border:1px solid var(--line); border-radius:10px;
    padding:10px 18px; margin:0 0 28px; line-height:1.6;
  }
  .sheet-btn[aria-disabled="true"]{ opacity:.5; cursor:not-allowed; pointer-events:none; }

  /* ---------- Admin ---------- */
  .lock-form{ max-width:340px; margin:40px auto; text-align:center; }
  .lock-form .icon{ font-size:32px; margin-bottom:14px; }
  .pw-input{
    width:100%; padding:13px 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:16px; margin:16px 0 10px;
    text-align:center; letter-spacing:0.08em; font-family:'Space Mono',monospace;
  }
  .pw-error{ color:var(--crimson); font-size:13px; margin-bottom:10px; min-height:18px; }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:26px; }
  .stat-card{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:0 8px 20px rgba(0,0,0,0.35); }
  .stat-card .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700; margin-bottom:8px; }
  .stat-card .val{ font-family:'Space Mono',monospace; font-size:20px; font-weight:700; }
  .stat-card .bar{ height:5px; border-radius:100px; background:var(--surface-3); margin-top:8px; overflow:hidden; }
  .stat-card .bar i{ display:block; height:100%; background:var(--gold); }

  table.admin-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  table.admin-table th{
    text-align:left; padding:12px 14px; background:var(--surface-2); color:var(--muted);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700;
    border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.admin-table td{ padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.admin-table tr:last-child td{ border-bottom:none; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:100px; font-size:11.5px; font-weight:700; }
  .pill.waiting{ background:rgba(var(--muted-rgb),0.18); color:var(--muted); }
  .pill.booked{ background:rgba(var(--jade-rgb),0.16); color:var(--jade); }
  .tiny-btn{
    font-size:11.5px; padding:5px 10px; border-radius:100px; border:1px solid var(--line);
    background:transparent; color:var(--muted);
  }
  .tiny-btn:hover{ border-color:var(--crimson); color:var(--crimson); }
  .tiny-btn-gold{
    font-size:11.5px; padding:5px 10px; border-radius:100px; border:1px solid rgba(var(--gold-rgb),0.45);
    background:rgba(var(--gold-rgb),0.1); color:var(--gold-bright); margin-left:6px;
  }
  .tiny-btn-gold:hover{ border-color:var(--gold-bright); background:rgba(var(--gold-rgb),0.2); }
  .tiny-btn-gold:disabled{ opacity:0.6; }
  .toolbar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .copy-btn, .sheet-btn{
    font-size:13px; padding:9px 16px; border-radius:100px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-dim); font-weight:700; display:flex; align-items:center; gap:6px;
    text-decoration:none;
  }
  .copy-btn:hover, .sheet-btn:hover{ border-color:var(--gold); color:var(--ink); }
  .conn-dot{ width:7px;height:7px;border-radius:50%; background:var(--jade); display:inline-block; margin-right:6px; box-shadow:0 0 0 3px rgba(var(--jade-rgb),0.2); }

  footer{ text-align:center; color:var(--muted); font-size:11.5px; letter-spacing:0.03em; margin-top:50px; }

  @media (max-width:520px){
    .ticket-bottom{ grid-template-columns:1fr 1fr; }
    .panel{ padding:22px; }
  }
</style>
</head>

  function answerById(id){
    for(var i=0;i<ANSWERS.length;i++){ if(ANSWERS[i].id===id) return ANSWERS[i]; }
    return null;
  }
  // Picks the right-language copy of an answer statement — falls back to
  // the Chinese original if, for some reason, no English text is set.
  function answerText(a){
    if(!a) return "";
    return (state.lang === "en" && a.textEn) ? a.textEn : a.text;
  }
  // Booking records saved to Firestore always carry the Chinese text (it's
  // what was current at the moment of booking) — so for display, look the
  // answer back up by id and re-translate it live, rather than trusting
  // whatever language happened to be stored. Falls back to the stored text
  // if the id can't be found (shouldn't happen, but keeps old data safe).
  function recAnswerText(rec){
    if(!rec) return "";
    var a = rec.answerId ? answerById(rec.answerId) : null;
    return a ? answerText(a) : (rec.answerText || "");
  }
  // The 25 cards only ever show the completion half of a sentence (e.g.
  // "Become a role model for the team") — on its own that reads like a
  // stray fragment, because the actual question ("The next goal I want to
  // achieve is…") is never shown next to it. These two helpers glue the
  // question stem back onto an answer for the few places that need the
  // whole sentence to read naturally: the final "sure you want to pick
  // this?" confirmation, the booked ticket, and HR's admin table.
  function fullSentence(a){ return t('questionStem') + answerText(a); }
  function recFullSentence(rec){ return t('questionStem') + recAnswerText(rec); }

  /* ============== BACKEND (Firebase Firestore) ============== */
  function backendReady(){ return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf("PASTE_YOUR") !== 0; }

  // Turns a candidate code into a safe Firestore document id (letters/
  // digits/underscore only) so odd characters in a name can never break a
  // doc path. Two different-looking candidate codes could in theory slugify
  // to the same id, but our real candidate list has none that collide.
  function slugify(s){
    return String(s).toUpperCase().trim().replace(/[^A-Z0-9]+/g, "_");
  }


  var fsDb = null;

  // Connects to Firestore and opens a live listener on the "bookings"
  // collection so every open tab sees, in real time, which candidates have
  // already booked and which answers are already taken — no polling
  // needed. Called once from initApp().
  function initFirebase(){
    if(!backendReady()) return;
    try{
      if(!firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
      fsDb = firebase.firestore();
      // Live "who's already booked" + "which answers are already taken"
      // sets, kept in sync from the same listener since every booking doc
      // carries both its candidate and its answerId. The name picker uses
      // the first to gray out taken names; the answer grid uses the
      // second to gray out taken answers. Examiner assignments are never
      // read here — only HR's admin panel loads full booking records.
      fsDb.collection("bookings").onSnapshot(function(snap){
        var booked = {}, taken = {};
        snap.forEach(function(doc){
          var d = doc.data();
          if(d && d.candidate) booked[d.candidate] = true;
          if(d && d.answerId) taken[d.answerId] = true;
        });
        state.bookedSet = booked;
        state.takenAnswerIds = taken;
        state.netError = "";
        // While the welcome splash is still playing, swallow this update
        // instead of re-rendering: a full re-render would recreate the
        // .intro-screen node and restart its CSS animations from scratch,
        // which is what caused the "flicker" — Firestore's listener fires
        // as soon as it connects (often more than once in the first
        // second or two), landing right in the middle of the splash. The
        // data is still saved above, so the landing/name-picker views see
        // it the instant the splash's own timer switches state.view away
        // from "intro".
        if(state.view === "intro") return;
        render();
      }, function(){
        state.netError = t('errCantReachServer');
        if(state.view === "intro") return;
        render();
      });
    }catch(e){
      state.netError = t('errFirebaseInit');
      render();
    }
  }

  // Checks (and books) an answer inside a single Firestore transaction, so
  // two candidates clicking the very same instant for the last copy of an
  // answer can never both win it — Firestore retries the transaction under
  // the hood if it detects a doc changed under it, and only one of the two
  // writes survives.
  function checkMine(candidate){
    return fsDb.collection("bookings").doc(slugify(candidate)).get().then(function(snap){
      return { ok: true, record: snap.exists ? snap.data() : null };
    });
  }

  // Atomically locks in one answer for one candidate. Two documents are
  // written together: the candidate's own "bookings/{candidate}" record
  // (also used by checkMine/ticketView/admin), and a tiny
  // "answerLocks/{answerId}" doc whose only job is to make the answer
  // itself impossible to double-claim — its existence is the lock, its
  // content is never read back anywhere else.
  function firestoreBookAnswer(candidate, answer){
    var bookingRef = fsDb.collection("bookings").doc(slugify(candidate));
    var lockRef = fsDb.collection("answerLocks").doc(answer.id);
    var examiner = examinerByKey(answer.examinerKey) || {};
    return fsDb.runTransaction(function(tx){
      return tx.get(bookingRef).then(function(bookingSnap){
        if(bookingSnap.exists){
          return { alreadyBooked: true, record: bookingSnap.data() };
        }
        return tx.get(lockRef).then(function(lockSnap){
          if(lockSnap.exists){
            return { taken: true };
          }
          var record = {
            candidate: candidate,
            answerId: answer.id,
            answerText: answer.text,
            examinerKey: answer.examinerKey,
            examinerName: examiner.name || "",
            examinerNickname: examiner.nickname || "",
            timestamp: new Date().toISOString()
          };
          tx.set(bookingRef, record);
          tx.set(lockRef, { by: candidate, at: record.timestamp });
          return { ok: true, record: record };
        });
      });
    });
  }

  // HR-only: undo a candidate's booking, freeing her chosen answer back up
  // for someone else (used when a candidate picked by mistake, etc).
  function adminReset(candidate){
    var bookingRef = fsDb.collection("bookings").doc(slugify(candidate));
    return fsDb.runTransaction(function(tx){
      return tx.get(bookingRef).then(function(bookingSnap){
        if(!bookingSnap.exists){ return { removed: false }; }
        var data = bookingSnap.data();
        tx.delete(bookingRef);
        if(data.answerId){
          tx.delete(fsDb.collection("answerLocks").doc(data.answerId));
        }
        return { removed: true };
      });
    });
  }

  // All sound effects share one lazily-created AudioContext instead of
  // spinning up a new one per sound — cheaper, and avoids ever hitting a
  // browser's cap on simultaneous AudioContexts if someone clicks fast.
  // Created only on first use (most browsers block audio before a user
  // gesture anyway), and never closed — it just sits idle between sounds.
  var sharedAudioCtx = null;
  function getAudioCtx(){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
    if(sharedAudioCtx.state === "suspended"){ try{ sharedAudioCtx.resume(); }catch(e){} }
    return sharedAudioCtx;
  }

  // A soft, short "tick" played on every button-ish click, so the interface
  // feels responsive even before a render finishes. Wrapped in try/catch:
  // some browsers restrict audio until a user gesture, and this should
  // never break the app's actual click handling if audio fails.
  function playClickSound(){
    try{
      var ctx = getAudioCtx();
      if(!ctx) return;
      var now = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = 720;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.09, now + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }catch(e){ /* audio not available — click still works */ }
  }

  // A short "success" chime (no audio file — synthesized with the Web
  // Audio API) that plays once a booking genuinely goes through. Wrapped
  // in try/catch: some browsers restrict audio until a user gesture, and
  // this should never break the booking flow if it fails.
  function playSuccessChime(){
    try{
      var ctx = getAudioCtx();
      if(!ctx) return;
      var now = ctx.currentTime;
      var notes = [523.25, 659.25, 783.99, 1046.50]; // C5 - E5 - G5 - C6, a bright little fanfare
      notes.forEach(function(freq, i){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        var start = now + i * 0.1;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.22, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.4);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.45);
      });
    }catch(e){ /* audio not available — booking still succeeded */ }
  }

  // A short, brand-toned confetti burst for the moment a mystery card
  // flips open. Runs on a <canvas> appended straight to <body> (outside
  // #root) so the periodic render() re-draws of the app never wipe it
  // mid-animation; it removes itself when done.
  function fireConfetti(){
    try{
      var W = window.innerWidth, H = window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      document.body.appendChild(canvas);
      var ctx = canvas.getContext('2d');
      if(!ctx){ canvas.remove(); return; }
      ctx.scale(dpr, dpr);

      // Warm gold / jade / crimson / cream — matches the page's own
      // palette instead of generic rainbow confetti.
      var colors = ['#a8783a', '#c4954f', '#3f8467', '#b23a4c', '#e8d4a8'];
      var count = window.innerWidth < 480 ? 60 : 100;
      var originX = W / 2, originY = H * 0.3;
      var pieces = [];
      for(var i = 0; i < count; i++){
        var angle = Math.random() * Math.PI * 2;
        var speed = 2.5 + Math.random() * 5;
        pieces.push({
          x: originX, y: originY,
          vx: Math.cos(angle) * speed * (0.4 + Math.random() * 0.6),
          vy: Math.sin(angle) * speed - 3,
          size: 4 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.35,
          shape: Math.random() < 0.5 ? 'rect' : 'circle'
        });
      }
      var gravity = 0.16, drag = 0.985, duration = 2000, start = null;

      function frame(ts){
        if(!start) start = ts;
        var elapsed = ts - start;
        ctx.clearRect(0, 0, W, H);
        var fade = Math.max(0, 1 - elapsed / duration);
        pieces.forEach(function(p){
          p.vx *= drag;
          p.vy = p.vy * drag + gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          if(p.shape === 'rect'){
            ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });
        if(elapsed < duration){
          requestAnimationFrame(frame);
        } else {
          canvas.remove();
        }
      }
      requestAnimationFrame(frame);
    }catch(e){ /* confetti is decorative — never let it block a booking */ }
  }

  function attemptBooking(candidate, answer){
    if(!backendReady()){
      state.pendingAnswerId = null;
      state.bookingError = t('errBackendNotReady');
      render();
      return;
    }
    state.booking = true; state.bookingError = ""; render();

    firestoreBookAnswer(candidate, answer).then(function(res){
      state.booking = false;
      if(!res){
        state.pendingAnswerId = null;
        state.bookingError = t('errBookingFailed');
        render();
        return;
      }
      if(res.alreadyBooked){
        state.myRecord = res.record;
        state.view = "ticket";
        render();
        return;
      }
      if(res.ok){
        state.myRecord = res.record;
        state.view = "ticket";
        render();
        fireConfetti();
        playSuccessChime();
        return;
      }
      if(res.taken){
        state.bookingError = t('errAnswerTaken');
        state.pendingAnswerId = null;
        render();
        return;
      }
      state.pendingAnswerId = null;
      state.bookingError = t('errSystemBusy');
      render();
    }).catch(function(){
      state.booking = false;
      state.pendingAnswerId = null;
      state.bookingError = t('errNetwork');
      render();
    });
  }

  /* ============== EVENTS ============== */
  function wireEvents(){
    var root = document.getElementById("root");

    root.querySelectorAll('[data-action]').forEach(function(el){
      el.addEventListener('click', function(ev){
        if(el.hasAttribute('data-stop')) return;
        playClickSound();
        var action = el.getAttribute('data-action');
        handleAction(action, el, ev);
      });
    });

    // Click-outside-to-cancel for the "sure you want to lock in this
    // answer?" confirm dialog — only when the click lands on the dimmed
    // backdrop itself, never when it bubbles up from the dialog box inside it.
    var pickModalBack = root.querySelector('.modal-back');
    if(pickModalBack){
      pickModalBack.addEventListener('click', function(ev){
        if(ev.target === pickModalBack){ handleAction('cancel-answer-pick'); }
      });
    }

    var searchAdmin = root.querySelector('[data-role="search-admin"]');
    if(searchAdmin){
      searchAdmin.addEventListener('input', function(){ state.adminSearch = searchAdmin.value; renderKeepFocus(searchAdmin); });
    }
    var pwInput = root.querySelector('[data-role="admin-pw"]');
    if(pwInput){
      pwInput.focus();
      pwInput.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter'){ handleAction('submit-admin-pw'); }
      });
    }
    var nameSearchInput = root.querySelector('[data-role="search-name"]');
    if(nameSearchInput){
      nameSearchInput.addEventListener('input', function(){ state.nameSearch = nameSearchInput.value; renderKeepFocus(nameSearchInput); });
    }

  }

  function renderKeepFocus(inputEl){
    var pos = inputEl.selectionStart;
    var val = inputEl.value;
    render();
    var root = document.getElementById("root");
    var again = root.querySelector('[data-role="' + inputEl.getAttribute('data-role') + '"]');
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
  }

  function handleAction(action, el){
    if(action === "toggle-lang"){
      state.lang = state.lang === "zh" ? "en" : "zh";
      try{ localStorage.setItem("examLang", state.lang); }catch(e){}
      render();
      return;
    }
    if(action === "start"){ state.view = "pick-candidate"; render(); return; }
    if(action === "go-landing"){
      state.view = "landing"; state.currentCandidate=null;
      state.pendingConfirmCandidate = null; state.nameSearch = "";
      render();
      return;
    }
    if(action === "go-pick-candidate"){
      state.view = "pick-candidate";
      state.pendingConfirmCandidate = null; state.nameSearch = "";
      render();
      return;
    }

    if(action === "pick-name"){
      var candidateName = el.getAttribute('data-candidate');
      if(!candidateName) return;
      state.pendingConfirmCandidate = candidateName;
      render();
      return;
    }

    if(action === "cancel-identity"){
      state.pendingConfirmCandidate = null;
      render();
      return;
    }

    if(action === "confirm-identity"){
      if(state.checkingMine) return;
      var c = state.pendingConfirmCandidate;
      if(!c) return;
      state.currentCandidate = c;
      state.checkingMine = true;
      state.bookingError = "";
      render();
      if(!backendReady()){
        state.checkingMine = false;
        state.pendingConfirmCandidate = null;
        enterPickAnswer();
        render();
        return;
      }
      checkMine(c).then(function(res){
        state.checkingMine = false;
        state.pendingConfirmCandidate = null;
        if(res && res.ok && res.record){
          state.myRecord = res.record;
          state.view = "ticket";
        } else {
          enterPickAnswer();
        }
        render();
      }).catch(function(){
        state.checkingMine = false;
        state.pendingConfirmCandidate = null;
        enterPickAnswer(); // fail open — worst case they try to book and the server catches a dupe
        render();
      });
      return;
    }

    if(action === "pick-answer"){
      // First tap just opens a "sure?" confirmation — nothing is booked
      // yet. See "confirm-answer-pick" for the actual booking.
      if(state.booking || state.pendingAnswerId) return;
      var id = el.getAttribute('data-id');
      var answer = answerById(id);
      if(!answer || !state.currentCandidate) return;
      state.pendingAnswerId = id;
      render();
      return;
    }
    if(action === "cancel-answer-pick"){
      state.pendingAnswerId = null;
      render();
      return;
    }
    if(action === "confirm-answer-pick"){
      var pendingId = state.pendingAnswerId;
      if(!pendingId) return;
      var pendingAnswer = answerById(pendingId);
      if(!pendingAnswer || !state.currentCandidate) return;
      attemptBooking(state.currentCandidate, pendingAnswer);
      return;
    }

    if(action === "open-admin"){ state.view = "admin-lock"; state.adminError=""; render(); return; }
    if(action === "exit-admin"){ state.view = "landing"; render(); return; }
    if(action === "submit-admin-pw"){
      var root = document.getElementById("root");
      var pw = root.querySelector('[data-role="admin-pw"]');
      var val = pw ? pw.value : "";
      if(val === ADMIN_KEY){
        state.view = "admin"; state.adminError="";
        render();
        loadAdminData();
      } else {
        state.adminError = t('wrongPassword');
        render();
      }
      return;
    }
    if(action === "refresh-admin"){ loadAdminData(); return; }
    if(action === "reset"){
      var c2 = el.getAttribute('data-candidate');
      if(el.getAttribute('data-armed') !== '1'){
        el.setAttribute('data-armed','1');
        el.textContent = t('resetConfirm');
        setTimeout(function(){ if(el.isConnected){ el.setAttribute('data-armed','0'); el.textContent=t('resetBtn'); } }, 3000);
        return;
      }
      el.disabled = true;
      el.textContent = t('resetting');
      adminReset(c2).then(function(){ loadAdminData(); }).catch(function(){ loadAdminData(); });
      return;
    }
    if(action === "copy-csv"){
      var lines = ["Candidate,FullName,PrivateCode,Status,AnswerText,Examiner,Timestamp"];
      var byC = {};
      state.adminRows.forEach(function(r){ byC[r.candidate] = r; });
      CANDIDATES.forEach(function(c3){
        var rec = byC[c3];
        var name3 = FULL_NAMES[c3] || "";
        var code3 = PRIVATE_CODES[c3] || "";
        if(rec){
          var answerCsv = '"' + recAnswerText(rec).replace(/"/g,'""') + '"';
          lines.push([c3, name3, code3, "Booked", answerCsv, rec.examinerName, rec.timestamp].join(","));
        }
        else { lines.push([c3, name3, code3, "Waiting", "", "", ""].join(",")); }
      });
      var csv = lines.join("\\n");
      var done = function(){ state.copyFeedback = true; render(); setTimeout(function(){ state.copyFeedback=false; render(); }, 1800); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(csv).then(done).catch(done);
      } else { done(); }
      return;
    }
    if(action === "gen-card"){
      var c4 = el.getAttribute('data-candidate');
      var origLabel = el.textContent;
      el.disabled = true;
      el.textContent = t('generating');
      generateExaminerCard(c4).then(function(){
        el.disabled = false;
        el.textContent = origLabel;
      }).catch(function(){
        el.disabled = false;
        el.textContent = t('genFailed');
      });
      return;
    }
  }

  function loadAdminData(){
    if(!backendReady()){
      state.adminLoaded = false;
      render();
      return;
    }
    state.adminLoading = true;
    render();
    fsDb.collection("bookings").get().then(function(snap){
      state.adminLoading = false;
      var rows = [];
      snap.forEach(function(doc){ rows.push(doc.data()); });
      state.adminRows = rows;
      state.adminLoaded = true;
      render();
    }).catch(function(){
      state.adminLoading = false;
      state.adminLoaded = false;
      render();
    });
  }

  // Renders one candidate's Examiner reveal as a downloadable PNG "card" —
  // for exam day, when HR announces each candidate's examiner in person.
  // Instead of reading it off the admin table (which shows all 25 rows
  // at once, plus the answer text — not something to hold up on a
  // phone screen in front of a candidate), HR clicks "生成卡片" once per
  // candidate and gets a single clean image with just her name and her
  // examiner, styled to match the rest of the page, ready to save to the
  // camera roll or AirDrop over. Drawn with the Canvas 2D API rather
  // than html2canvas or similar, since nothing else needs to be loaded.
  function generateExaminerCard(candidate){
    var byC = {};
    state.adminRows.forEach(function(r){ byC[r.candidate] = r; });
    var rec = byC[candidate];
    if(!rec){ return Promise.reject(new Error("no booking for " + candidate)); }
    var ex = examinerByKey(rec.examinerKey) || {};
    var fullName = FULL_NAMES[candidate] || candidate;
    var code = PRIVATE_CODES[candidate] || "";

    var W = 1200, H = 1600;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var g = canvas.getContext("2d");

    // Fit `text` on one line inside maxWidth by shrinking the font size
    // (never wrapping — every string this card draws is short enough
    // that a smaller size always reads better than a line break).
    function fitSize(text, maxWidth, startSize, minSize, weight, family){
      var size = startSize;
      while(size > minSize){
        g.font = weight + " " + size + "px " + family;
        if(g.measureText(text).width <= maxWidth) break;
        size -= 2;
      }
      return size;
    }
    function centerText(text, y, size, weight, family, color){
      g.font = weight + " " + size + "px " + family;
      g.fillStyle = color;
      g.textAlign = "center";
      g.fillText(text, W/2, y);
    }

    function loadImg(src){
      return new Promise(function(resolve){
        if(!src){ resolve(null); return; }
        var img = new Image();
        img.onload = function(){ resolve(img); };
        img.onerror = function(){ resolve(null); };
        img.src = src;
      });
    }

    return new Promise(function(resolve){
      if(document.fonts && document.fonts.ready){ document.fonts.ready.then(resolve); }
      else resolve();
    }).then(function(){
      return Promise.all([
        loadImg(UR_LOGO),
        loadImg(EXAMINER_PHOTOS[rec.examinerKey])
      ]);
    }).then(function(imgs){
      var logo = imgs[0], photo = imgs[1];
      // Background: base chocolate fill + a soft gold glow bloom behind
      // the examiner reveal, echoing the on-page intro splash.
      g.fillStyle = "#241b15";
      g.fillRect(0, 0, W, H);
      var glow = g.createRadialGradient(W/2, 1040, 40, W/2, 1040, 620);
      glow.addColorStop(0, "rgba(211,165,104,0.28)");
      glow.addColorStop(1, "rgba(211,165,104,0)");
      g.fillStyle = glow;
      g.fillRect(0, 0, W, H);

      // Outer card frame, gold hairline with a faint glow.
      var pad = 54;
      var radius = 34;
      g.save();
      g.shadowColor = "rgba(211,165,104,0.35)";
      g.shadowBlur = 30;
      g.strokeStyle = "rgba(211,165,104,0.55)";
      g.lineWidth = 2;
      roundRectPath(g, pad, pad, W-pad*2, H-pad*2, radius);
      g.stroke();
      g.restore();

      var cx = W/2;

      // Header
      centerText("Q2 · QUARTER BONUS EXAM", 168, 26, "700", "'Manrope',sans-serif", "#a3906f");
      centerText("EXAMINER  REVEAL", 210, 32, "800", "'Manrope',sans-serif", "#d3a568");
      drawDivider(g, cx, 250, 140);

      // Logo
      if(logo){
        var lw = 140, lh = lw * (logo.naturalHeight/logo.naturalWidth || 0.6);
        g.drawImage(logo, cx - lw/2, 300, lw, lh);
      }

      // Candidate
      centerText(t('cardCandidateLabel'), 520, 24, "700", "'Manrope',sans-serif", "#a3906f");
      var nameSize = fitSize(fullName, W - pad*2 - 100, 66, 34, "700", "'Noto Serif SC',serif");
      centerText(fullName, 585, nameSize, "700", "'Noto Serif SC',serif", "#ecdfc9");
      if(code) centerText(code, 625, 22, "500", "'Space Mono',monospace", "#a3906f");

      drawDivider(g, cx, 690, 200);

      // Examiner reveal — the centerpiece. A real headshot reads far
      // warmer here than a generic icon, since HR is about to hold this
      // up (or send it) as the actual reveal moment for that candidate —
      // so we fall back to the emoji only if a photo failed to load.
      centerText(t('cardYourExaminer'), 750, 26, "700", "'Manrope',sans-serif", "#a3906f");
      var pcx = cx, pcy = 905, prad = 130;
      g.save();
      g.shadowColor = "rgba(211,165,104,0.5)";
      g.shadowBlur = 44;
      g.beginPath();
      g.arc(pcx, pcy, prad, 0, Math.PI*2);
      g.fillStyle = "rgba(211,165,104,0.3)";
      g.fill();
      g.restore();
      g.save();
      g.beginPath();
      g.arc(pcx, pcy, prad, 0, Math.PI*2);
      g.closePath();
      g.clip();
      if(photo){
        g.drawImage(photo, pcx-prad, pcy-prad, prad*2, prad*2);
      } else {
        g.fillStyle = "#2f2419";
        g.fillRect(pcx-prad, pcy-prad, prad*2, prad*2);
        g.font = "120px sans-serif";
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(ex.icon || "★", pcx, pcy+8);
        g.textBaseline = "alphabetic";
      }
      g.restore();
      g.save();
      g.beginPath();
      g.arc(pcx, pcy, prad, 0, Math.PI*2);
      g.lineWidth = 5;
      g.strokeStyle = "rgba(211,165,104,0.85)";
      g.stroke();
      g.beginPath();
      g.arc(pcx, pcy, prad+9, 0, Math.PI*2);
      g.lineWidth = 1.5;
      g.strokeStyle = "rgba(211,165,104,0.32)";
      g.stroke();
      g.restore();

      var exGrad = g.createLinearGradient(cx-320, 0, cx+320, 0);
      exGrad.addColorStop(0, "#d3a568");
      exGrad.addColorStop(0.32, "#eebd82");
      exGrad.addColorStop(0.5, "#fff6e2");
      exGrad.addColorStop(0.68, "#eebd82");
      exGrad.addColorStop(1, "#d3a568");
      var exSize = fitSize(rec.examinerName || "", W - pad*2 - 100, 72, 40, "800", "'Playfair Display',serif");
      g.font = "800 " + exSize + "px 'Playfair Display',serif";
      g.fillStyle = exGrad;
      g.textAlign = "center";
      g.fillText(rec.examinerName || "", cx, 1100);

      if(ex.nickname) centerText(ex.nickname, 1144, 24, "500", "'Cormorant Garamond',serif", "#cdb794");

      drawDivider(g, cx, 1205, 200);
      if(rec.timestamp) centerText(t('cardPickedAt') + fmtTime(rec.timestamp), 1256, 21, "500", "'Space Mono',monospace", "#786646");
      drawDots(g, cx, 1320, 260, 3);

      // Footer
      centerText("UR MANAGEMENT & SUPPLIES SDN BHD", H-120, 22, "700", "'Manrope',sans-serif", "#a3906f");
      centerText("Quarter 2 Bonus Exam", H-84, 20, "500", "'Manrope',sans-serif", "#786646");

      var url = canvas.toDataURL("image/png");
      var a = document.createElement("a");
      a.href = url;
      a.download = "Examiner-" + slugify(candidate) + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  }
  function roundRectPath(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x+r, y);
    g.arcTo(x+w, y, x+w, y+h, r);
    g.arcTo(x+w, y+h, x, y+h, r);
    g.arcTo(x, y+h, x, y, r);
    g.arcTo(x, y, x+w, y, r);
    g.closePath();
  }
  function drawDots(g, cx, y, width, r){
    var n = 14, gap = width/(n-1);
    g.fillStyle = "rgba(211,165,104,0.4)";
    for(var i=0;i<n;i++){
      g.beginPath();
      g.arc(cx - width/2 + i*gap, y, r, 0, Math.PI*2);
      g.fill();
    }
  }
  function drawDivider(g, cx, y, width){
    var grad = g.createLinearGradient(cx-width/2, 0, cx+width/2, 0);
    grad.addColorStop(0, "rgba(211,165,104,0)");
    grad.addColorStop(0.5, "rgba(211,165,104,0.7)");
    grad.addColorStop(1, "rgba(211,165,104,0)");
    g.strokeStyle = grad;
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(cx-width/2, y);
    g.lineTo(cx+width/2, y);
    g.stroke();
  }

  function initApp(){
    render();
    initFirebase();
    // Let the staged reveal play all the way through (logo settles, rule
    // draws, both lines rise in, one full gold light-sweep) and sit for a
    // moment before dissolving into the real landing screen — a fixed
    // timer, not gated on anything loading, so it never leaves anyone
    // stuck looking at "恭喜入围" if Firebase is slow (or not configured
    // at all).
    if(state.view === "intro"){
      setTimeout(function(){
        var introEl = document.querySelector('.intro-screen');
        if(introEl){ introEl.classList.add('intro-out'); }
        setTimeout(function(){
          if(state.view === "intro"){ state.view = "landing"; render(); }
        }, 600);
      }, 2800);
    }
  }

  initApp();
})();
</script>
